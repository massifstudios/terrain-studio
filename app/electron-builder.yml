appId: dev.neoworks.terrain-studio
productName: Terrain Studio
directories:
  output: release
files:
  - out/**
  - package.json
# The engine addon stays outside the asar so the utilityProcess can dlopen it.
extraResources:
  - from: ../bridge/build/Release/engine.node
    to: engine.node
  # Satellite colour strips and any other engine assets, read by the engine
  # through TERRAIN_ASSET_PATH.
  - from: ../engine/assets
    to: assets
linux:
  target: dir
  category: Graphics
